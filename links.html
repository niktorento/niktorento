<style>
:root{--g1:#2a1f00;--g2:#8B6914;--g3:#C9960A;--g4:#E4B824;--g5:#F5D060;--g6:#FDE99A;--gold-metal:linear-gradient(135deg,#8B6914 0%,#E4B824 30%,#FDE99A 50%,#E4B824 68%,#8B6914 100%);--gold-text:linear-gradient(100deg,#8B6914 0%,#E4B824 28%,#FDE99A 50%,#E4B824 72%,#8B6914 100%);--black:#060606;--black2:#0f0f0f;--black3:#181818;--white:#f4efe5;--muted:rgba(244,239,229,0.6);--faint:rgba(244,239,229,0.25)}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--black);color:var(--white);font-family:Barlow,sans-serif;font-weight:300;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:60px 24px}
.lt-bg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(180,120,5,.09) 0%,transparent 60%)}
.lt-grid{position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(to right,rgba(201,150,10,.02) 1px,transparent 1px),linear-gradient(to bottom,rgba(201,150,10,.02) 1px,transparent 1px);background-size:60px 60px}
.lt-inner{position:relative;z-index:1;width:100%;max-width:480px}
.lt-name{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:6px;text-align:center;background:var(--gold-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px;text-transform:uppercase}
.lt-sub{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:6px;text-align:center;background:var(--gold-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px;text-transform:uppercase}
.lt-bio{text-align:center;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--faint);margin-bottom:40px}
.lt-section-label{font-size:9px;letter-spacing:4px;text-transform:uppercase;background:var(--gold-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;margin:28px 0 12px;display:flex;align-items:center;gap:10px;justify-content:center}
.lt-section-label::before,.lt-section-label::after{content:'';display:block;flex:1;height:1px;background:linear-gradient(to right,transparent,#C9960A,transparent)}
.lt-links{display:flex;flex-direction:column;gap:10px}
.lt-link{display:flex;align-items:center;gap:14px;padding:15px 22px;background:rgba(255,255,255,.03);border:1px solid rgba(201,150,10,.18);color:var(--white);text-decoration:none;font-size:11px;letter-spacing:3px;text-transform:uppercase;transition:all .25s;position:relative;overflow:hidden}
.lt-link::before{content:'';position:absolute;inset:0;background:var(--gold-metal);background-size:200% auto;opacity:0;transition:opacity .25s}
.lt-link:hover{border-color:#E4B824;color:#2a1f00;transform:translateX(4px)}
.lt-link:hover::before{opacity:1;animation:shimmer 2.5s linear infinite}
.lt-link-icon{position:relative;z-index:1;flex-shrink:0;opacity:.7}
.lt-link span{position:relative;z-index:1;flex:1}
.lt-link-arrow{position:relative;z-index:1;font-size:14px;opacity:.4;transition:opacity .2s,transform .2s}
.lt-link:hover .lt-link-arrow{opacity:1;transform:translateX(3px)}
.lt-back{margin-top:44px;text-align:center;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--faint);text-decoration:none;transition:color .2s;display:block}
.lt-back:hover{color:#E4B824}
</style>
</head>
